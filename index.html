<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사자성어 완성하기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans KR & Gowun Batang) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library for High Score Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            300: '#7dd3fc',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        pastelBg: '#F3F4F6',
                        pastelCard: '#FFFFFF',
                        pastelSuccess: '#10B981',
                        pastelWarning: '#F59E0B',
                        pastelDanger: '#EF4444',
                        pastelAccent: '#8B5CF6'
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        batang: ['Gowun Batang', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 50%, #fce7f3 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .batang-font {
            font-family: 'Gowun Batang', serif;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes pulseAlert {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.8; }
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        .animate-pulse-alert {
            animation: pulseAlert 0.8s infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-3 md:p-6 text-slate-800">

    <!-- Game Main Container -->
    <main class="w-full max-w-lg bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-white/60 overflow-hidden relative min-h-[620px] flex flex-col justify-between transition-all duration-300">

        <!-- ==================== 1. START SCREEN ==================== -->
        <section id="start-screen" class="p-6 md:p-8 flex flex-col items-center justify-between min-h-[620px] w-full animate-pop">
            <div class="w-full text-center mt-2">
                <!-- Top Badge -->
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-sky-100 text-sky-700 mb-3 border border-sky-200 shadow-sm">
                    <i class="fa-solid fa-graduation-cap"></i> 고등학생 필수 어휘력 향상
                </span>
                
                <h1 class="text-3xl md:text-4xl font-black text-slate-800 tracking-tight mt-1 flex items-center justify-center gap-2">
                    <span>사자성어 완성하기</span>
                </h1>
                <p class="text-xs md:text-sm text-slate-500 mt-2">비어있는 두 글자를 채워 사자성어를 완성하세요!</p>
            </div>

            <!-- Cute Mascot Illustration / Icon Box -->
            <div class="my-6 text-center">
                <div class="relative w-36 h-36 md:w-40 md:h-40 mx-auto bg-gradient-to-tr from-sky-400 to-indigo-400 rounded-full flex items-center justify-center shadow-lg border-4 border-white transform hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-book-open-reader text-6xl md:text-7xl text-white"></i>
                    <div class="absolute -bottom-1 -right-1 bg-amber-400 text-white p-2.5 rounded-full shadow-md text-xl animate-bounce">
                        <i class="fa-solid fa-lightbulb"></i>
                    </div>
                </div>
            </div>

            <!-- Best Score Box -->
            <div class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-center shadow-inner">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">내 최고 기록 (High Score)</div>
                <div class="text-2xl md:text-3xl font-black text-indigo-600 mt-1 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trophy text-amber-500"></i>
                    <span id="start-high-score">0</span> <span class="text-base font-bold text-slate-600">점</span>
                </div>
            </div>

            <!-- Start Game Button -->
            <div class="w-full space-y-3 mt-6">
                <button id="btn-start-game" onclick="startGame(false)" class="w-full py-4 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white text-lg font-bold rounded-2xl shadow-lg hover:shadow-indigo-200 transform active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 게임 시작하기
                </button>
            </div>
        </section>

        <!-- ==================== 2. QUIZ SCREEN ==================== -->
        <section id="quiz-screen" class="hidden p-5 md:p-7 flex flex-col justify-between min-h-[620px] w-full">
            <!-- Header Bar -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <!-- Progress Info -->
                    <div class="flex items-center gap-2">
                        <span id="quiz-difficulty" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700 border border-indigo-200">
                            초급
                        </span>
                        <span id="review-tag" class="hidden px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700 border border-amber-200">
                            <i class="fa-solid fa-rotate-left mr-1"></i>복습 모드
                        </span>
                        <span id="quiz-index" class="text-sm font-bold text-slate-600">1 / 10</span>
                    </div>

                    <!-- Live Score -->
                    <div class="flex items-center gap-1 font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full text-sm">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        <span>점수:</span>
                        <span id="quiz-score" class="text-indigo-600 font-extrabold">0</span>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-2.5 mb-4 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-sky-400 to-indigo-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>

                <!-- Timer Bar -->
                <div id="timer-box" class="flex items-center justify-between bg-amber-50 border border-amber-200/80 rounded-xl px-4 py-2 text-amber-800">
                    <div class="flex items-center gap-2 font-bold text-sm">
                        <i id="timer-icon" class="fa-solid fa-clock text-amber-500"></i>
                        <span id="timer-label">남은 시간</span>
                    </div>
                    <span id="timer-seconds" class="text-xl font-black font-mono text-amber-600">20초</span>
                </div>
            </div>

            <!-- Idiom Display Box -->
            <div class="my-4 py-6 bg-slate-50 border-2 border-slate-200/60 rounded-3xl text-center shadow-sm relative">
                <p class="text-xs text-slate-400 mb-2 font-medium">네 글자 사자성어</p>
                <div id="idiom-display" class="text-4xl md:text-5xl font-extrabold tracking-widest text-slate-800 flex items-center justify-center gap-2 batang-font">
                    <!-- Dynamic rendering: e.g., 일 석 □ □ -->
                </div>
            </div>

            <!-- Hint Display Box (Initially Hidden) -->
            <div id="hint-box" class="hidden mb-3 p-3 bg-indigo-50 border border-indigo-100 rounded-2xl text-xs md:text-sm text-indigo-900 animate-pop">
                <div class="font-bold mb-1 text-indigo-700 flex items-center gap-1">
                    <i class="fa-solid fa-lightbulb text-amber-400"></i> 힌트 (사자성어 의미)
                </div>
                <p id="hint-text" class="leading-relaxed">힌트 내용이 들어갑니다.</p>
            </div>

            <!-- Input Form & Action Buttons -->
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="answer-input" maxlength="2" placeholder="빈칸의 두 글자 입력" autocomplete="off"
                        class="w-full py-3.5 px-4 text-center text-xl font-bold rounded-2xl border-2 border-slate-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all placeholder:text-base placeholder:font-normal placeholder:text-slate-400">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button id="btn-hint" onclick="showHint()" class="py-3 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold rounded-xl transition-all text-sm flex items-center justify-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-lightbulb"></i> 힌트 보기
                    </button>
                    <button id="btn-submit" onclick="submitAnswer()" class="col-span-2 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-check"></i> 정답 확인 (Enter)
                    </button>
                </div>
            </div>
        </section>

        <!-- ==================== 3. EXPLANATION MODAL / FEEDBACK ==================== -->
        <div id="explanation-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-white p-6 animate-pop flex flex-col justify-between max-h-[90vh] overflow-y-auto">
                <!-- Result Status Header -->
                <div>
                    <div id="result-status-badge" class="text-center py-2 px-4 rounded-full text-base font-black mb-4 flex items-center justify-center gap-2">
                        <!-- Correct or Incorrect icon + text -->
                    </div>

                    <!-- Idiom & Hanja Title -->
                    <div class="text-center border-b border-slate-100 pb-4 mb-4">
                        <div id="exp-idiom" class="text-3xl font-extrabold text-slate-800 tracking-wider batang-font">일석이조</div>
                        <div id="exp-hanja" class="text-lg font-bold text-indigo-600 mt-1 tracking-widest">一石二鳥</div>
                    </div>

                    <!-- Hanja Character Breakdown -->
                    <div class="mb-4">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">한자 풀이</h4>
                        <div id="exp-char-grid" class="grid grid-cols-4 gap-2 text-center">
                            <!-- Dynamic 4 characters card -->
                        </div>
                    </div>

                    <!-- Overall Meaning -->
                    <div class="mb-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                        <h4 class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">전체 의미</h4>
                        <p id="exp-meaning" class="text-sm font-medium text-slate-700 leading-relaxed">사자성어 뜻 내용</p>
                    </div>

                    <!-- Example Sentence -->
                    <div class="mb-6 bg-amber-50/60 p-3.5 rounded-2xl border border-amber-100/80">
                        <h4 class="text-xs font-bold text-amber-700 uppercase tracking-wider mb-1"><i class="fa-solid fa-quote-left mr-1"></i>실생활 예문</h4>
                        <p id="exp-example" class="text-sm font-medium text-slate-700 italic leading-relaxed">예문 들어가는 자리</p>
                    </div>
                </div>

                <!-- Next Button -->
                <button onclick="nextQuestion()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg transition-all text-base flex items-center justify-center gap-2 active:scale-95">
                    <span>다음 문제로</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- ==================== 4. RESULT SCREEN ==================== -->
        <section id="result-screen" class="hidden p-6 md:p-8 flex flex-col justify-between min-h-[620px] w-full animate-pop">
            <div class="text-center">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 mb-2 border border-emerald-200">
                    <i class="fa-solid fa-flag-checkered"></i> 게임 완료
                </span>
                <h2 class="text-2xl md:text-3xl font-black text-slate-800">최종 결과</h2>
            </div>

            <!-- Score Cards Overview -->
            <div class="my-4 space-y-3">
                <!-- Total Score Large Card -->
                <div class="bg-gradient-to-r from-indigo-500 to-sky-500 rounded-2xl p-5 text-white text-center shadow-lg relative overflow-hidden">
                    <div class="text-xs opacity-80 uppercase tracking-wider font-semibold">최종 점수</div>
                    <div class="text-4xl md:text-5xl font-black mt-1"><span id="final-score">0</span> <span class="text-xl font-bold">/ 100점</span></div>
                    <div id="high-score-badge" class="hidden absolute top-3 right-3 bg-amber-400 text-amber-900 text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow">
                        <i class="fa-solid fa-crown mr-0.5"></i> 최고 기록 달성!
                    </div>
                </div>

                <!-- Stat Details Grid -->
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-50 border border-slate-200/80 p-3 rounded-xl">
                        <div class="text-xs text-slate-400 font-bold">정답</div>
                        <div class="text-lg font-black text-emerald-600 mt-0.5" id="final-correct">0개</div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200/80 p-3 rounded-xl">
                        <div class="text-xs text-slate-400 font-bold">오답</div>
                        <div class="text-lg font-black text-rose-500 mt-0.5" id="final-incorrect">0개</div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200/80 p-3 rounded-xl">
                        <div class="text-xs text-slate-400 font-bold">정답률</div>
                        <div class="text-lg font-black text-indigo-600 mt-0.5" id="final-rate">0%</div>
                    </div>
                </div>

                <!-- High Score Record info -->
                <div class="flex justify-between items-center bg-amber-50 border border-amber-200/70 px-4 py-2.5 rounded-xl text-xs text-amber-900 font-medium">
                    <span><i class="fa-solid fa-trophy text-amber-500 mr-1"></i> 브라우저 최고 점수</span>
                    <span id="final-high-score" class="font-extrabold text-sm text-amber-700">0점</span>
                </div>
            </div>

            <!-- Incorrect Questions List Box (Review List) -->
            <div id="incorrect-section" class="mb-4">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>틀린 문제 목록</span>
                    <span id="incorrect-count-badge" class="text-rose-500 font-extrabold text-xs">0개</span>
                </h4>
                <div id="incorrect-list" class="max-h-32 overflow-y-auto space-y-1.5 pr-1 text-xs">
                    <!-- Incorrect items dynamic injection -->
                </div>
            </div>

            <!-- Result Action Buttons -->
            <div class="space-y-2 mt-2">
                <button id="btn-review" onclick="startGame(true)" class="hidden w-full py-3 bg-amber-500 hover:bg-amber-600 text-white text-base font-bold rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-rotate-left"></i> 틀린 문제 다시 풀기 (복습 모드)
                </button>
                <button onclick="startGame(false)" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-base font-bold rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-arrows-rotate"></i> 새 게임 시작
                </button>
                <button onclick="showStartScreen()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold rounded-2xl transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-house"></i> 시작 화면으로 돌아가기
                </button>
            </div>
        </section>

    </main>

    <!-- JS Logic -->

            {

                hanja: "過猶不及",
                difficulty: "고급",
                characterMeanings: [

                    { char: "猶", sound: "유", meaning: "같을" },
                    { char: "不", sound: "불", meaning: "아닐" },
                    { char: "及", sound: "급", meaning: "미칠" }
                ],
                meaning: "정도에 지나친 것은 미치지 못한 것과 같음.",
                example: "의욕이 넘치는 것은 좋지만 과유불급이니 건강을 해치지 않게 조심해라."

            {

                hanja: "他山之石",

                meaning: "다른 사람의 하찮은 언행이나 실수도 나의 교훈으로 삼음.",
                example: "타인의 실수를 비방하기보다는 타산지석으로 삼아 스스로 돌아보아야 한다."
            },
            {
                idiom: "호시탐탐",
                hanja: "虎視眈眈",
                difficulty: "고급",
                characterMeanings: [
                    { char: "虎", sound: "호", meaning: "범" },
                    { char: "視", sound: "시", meaning: "볼" },
                    { char: "眈", sound: "탐", meaning: "노려볼" },
                    { char: "眈", sound: "탐", meaning: "노려볼" }
                ],
                meaning: "호랑이가 먹이를 노려보듯 기회를 엿보며 재기나 공격의 틈을 노림.",
                example: "상대 팀은 우리의 작은 실수를 노리며 호시탐탐 반격의 기회를 엿보고 있었다."
            }
        ];

        /* ==================== 2. GAME STATE VARIABLES ==================== */
        const STORAGE_KEY = 'sajaseongeo_highscore';
        let highScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;

        let gameQuestions = []; // Selected 10 questions
        let currentQuestionIndex = 0;
        let currentScore = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let incorrectQuestionsList = []; // Array of missed items for review

        let isReviewMode = false;
        let timerInterval = null;
        let timeLeft = 20;
        let isAnswerSubmitted = false;

        /* Current active question meta */
        let currentIdiomObj = null;
        let missingPosition = 'front'; // 'front' (□□이몽) or 'back' (일석□□)
        let targetAnswer = '';

        /* ==================== 3. DOM ELEMENTS ==================== */
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const expModal = document.getElementById('explanation-modal');

        const startHighScoreEl = document.getElementById('start-high-score');
        const finalHighScoreEl = document.getElementById('final-high-score');

        const quizIndexEl = document.getElementById('quiz-index');
        const quizScoreEl = document.getElementById('quiz-score');
        const quizDifficultyEl = document.getElementById('quiz-difficulty');
        const reviewTagEl = document.getElementById('review-tag');
        const progressBarEl = document.getElementById('progress-bar');

        const timerBoxEl = document.getElementById('timer-box');
        const timerSecondsEl = document.getElementById('timer-seconds');
        const timerIconEl = document.getElementById('timer-icon');

        const idiomDisplayEl = document.getElementById('idiom-display');
        const answerInput = document.getElementById('answer-input');
        const hintBoxEl = document.getElementById('hint-box');
        const hintTextEl = document.getElementById('hint-text');

        /* ==================== 4. INITIALIZATION ==================== */
        window.onload = function() {
            updateHighScoreDisplay();
            
            // Allow Enter key inside input to submit
            answerInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitAnswer();
                }
            });

            // Restrict input to Korean/hangul characters only and auto length control
            answerInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^가-힣]/g, '');
            });
        };

        function updateHighScoreDisplay() {
            startHighScoreEl.textContent = highScore;
            finalHighScoreEl.textContent = highScore + '점';
        }

        function showStartScreen() {
            stopTimer();
            expModal.classList.add('hidden');
            quizScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            updateHighScoreDisplay();
        }

        /* ==================== 5. GAME START & FLOW ==================== */
        function startGame(reviewMode = false) {
            isReviewMode = reviewMode;
            currentQuestionIndex = 0;
            currentScore = 0;
            correctCount = 0;
            incorrectCount = 0;

            if (isReviewMode) {
                // Use only missed questions from previous round
                gameQuestions = [...incorrectQuestionsList];
                incorrectQuestionsList = []; // Reset for new tracking
            } else {
                // Fresh new game: Select 10 random non-repeating questions
                incorrectQuestionsList = [];
                gameQuestions = selectRandomQuestions(10);
            }

            if (gameQuestions.length === 0) {
                alert('복습할 틀린 문제가 없습니다!');
                return;
            }

            // UI Mode Adjustments
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            expModal.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            if (isReviewMode) {
                reviewTagEl.classList.remove('hidden');
                timerBoxEl.classList.add('hidden'); // No time limit in review mode
            } else {
                reviewTagEl.classList.add('hidden');
                timerBoxEl.classList.remove('hidden');
            }

            loadQuestion();
        }

        // Random sampling algorithm
        function selectRandomQuestions(count) {
            let shuffled = [...idiomDatabase].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, Math.min(count, shuffled.length));
        }

        /* ==================== 6. QUESTION DISPLAY ==================== */
        function loadQuestion() {
            isAnswerSubmitted = false;
            hintBoxEl.classList.add('hidden');
            answerInput.value = '';
            answerInput.disabled = false;
            document.getElementById('btn-submit').disabled = false;
            document.getElementById('btn-hint').disabled = false;

            currentIdiomObj = gameQuestions[currentQuestionIndex];

            // Update UI Counters
            quizIndexEl.textContent = `${currentQuestionIndex + 1} / ${gameQuestions.length}`;
            quizScoreEl.textContent = currentScore;
            quizDifficultyEl.textContent = currentIdiomObj.difficulty;

            // Set Progress Bar
            let progressPercent = ((currentQuestionIndex + 1) / gameQuestions.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            // Decide randomly: show front 2 chars OR back 2 chars
            missingPosition = Math.random() < 0.5 ? 'front' : 'back';

            let fullIdiom = currentIdiomObj.idiom; // e.g. "일석이조"
            if (missingPosition === 'front') {
                // □ □ 이 조
                targetAnswer = fullIdiom.substring(0, 2);
                let visibleChars = fullIdiom.substring(2, 4);
                idiomDisplayEl.innerHTML = `
                    <span class="inline-block px-2 py-1 bg-indigo-100 text-indigo-500 rounded-xl border border-indigo-200">□</span>
                    <span class="inline-block px-2 py-1 bg-indigo-100 text-indigo-500 rounded-xl border border-indigo-200">□</span>
                    <span class="inline-block px-2 py-1 text-slate-800">${visibleChars[0]}</span>
                    <span class="inline-block px-2 py-1 text-slate-800">${visibleChars[1]}</span>
                `;
            } else {
                // 일 석 □ □
                targetAnswer = fullIdiom.substring(2, 4);
                let visibleChars = fullIdiom.substring(0, 2);
                idiomDisplayEl.innerHTML = `
                    <span class="inline-block px-2 py-1 text-slate-800">${visibleChars[0]}</span>
                    <span class="inline-block px-2 py-1 text-slate-800">${visibleChars[1]}</span>
                    <span class="inline-block px-2 py-1 bg-indigo-100 text-indigo-500 rounded-xl border border-indigo-200">□</span>
                    <span class="inline-block px-2 py-1 bg-indigo-100 text-indigo-500 rounded-xl border border-indigo-200">□</span>
                `;
            }

            // Auto focus on mobile & PC
            setTimeout(() => answerInput.focus(), 100);

            // Start Timer if not review mode
            if (!isReviewMode) {
                startTimer();
            }
        }

        /* ==================== 7. TIMER LOGIC ==================== */
        function startTimer() {
            stopTimer();
            timeLeft = 20;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 0) {
                    stopTimer();
                    handleTimeout();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerUI() {
            timerSecondsEl.textContent = `${timeLeft}초`;

            if (timeLeft <= 5) {
                timerBoxEl.className = "flex items-center justify-between bg-rose-50 border border-rose-300 rounded-xl px-4 py-2 text-rose-800 animate-pulse-alert";
                timerSecondsEl.className = "text-xl font-black font-mono text-rose-600";
                timerIconEl.className = "fa-solid fa-triangle-exclamation text-rose-500";
            } else {
                timerBoxEl.className = "flex items-center justify-between bg-amber-50 border border-amber-200/80 rounded-xl px-4 py-2 text-amber-800";
                timerSecondsEl.className = "text-xl font-black font-mono text-amber-600";
                timerIconEl.className = "fa-solid fa-clock text-amber-500";
            }
        }

        function handleTimeout() {
            if (isAnswerSubmitted) return;
            processAnswer(false, "시간 초과!");
        }

        /* ==================== 8. HINT FUNCTION ==================== */
        function showHint() {
            hintTextEl.textContent = currentIdiomObj.meaning;
            hintBoxEl.classList.remove('hidden');
        }

        /* ==================== 9. SUBMIT ANSWER ==================== */
        function submitAnswer() {
            if (isAnswerSubmitted) return;

            let userInput = answerInput.value.trim();

            if (userInput.length !== 2) {
                // Visual shake feedback on input box
                answerInput.classList.add('animate-shake', 'border-rose-400');
                setTimeout(() => {
                    answerInput.classList.remove('animate-shake', 'border-rose-400');
                }, 400);
                return;
            }

            stopTimer();

            let isCorrect = (userInput === targetAnswer);
            processAnswer(isCorrect, isCorrect ? "정답입니다!" : "오답입니다.");
        }

        function processAnswer(isCorrect, statusMsg) {
            isAnswerSubmitted = true;
            answerInput.disabled = true;
            document.getElementById('btn-submit').disabled = true;

            if (isCorrect) {
                currentScore += 10;
                correctCount++;
            } else {
                incorrectCount++;
                // Add to review list if not already present
                if (!incorrectQuestionsList.some(item => item.idiom === currentIdiomObj.idiom)) {
                    incorrectQuestionsList.push(currentIdiomObj);
                }
            }

            showExplanationModal(isCorrect, statusMsg);
        }

        /* ==================== 10. EXPLANATION MODAL ==================== */
        function showExplanationModal(isCorrect, statusMsg) {
            const statusBadge = document.getElementById('result-status-badge');
            const expIdiom = document.getElementById('exp-idiom');
            const expHanja = document.getElementById('exp-hanja');
            const expCharGrid = document.getElementById('exp-char-grid');
            const expMeaning = document.getElementById('exp-meaning');
            const expExample = document.getElementById('exp-example');

            // Badge styling based on result
            if (isCorrect) {
                statusBadge.className = "text-center py-2 px-4 rounded-full text-base font-black mb-4 flex items-center justify-center gap-2 bg-emerald-100 text-emerald-800 border border-emerald-200";
                statusBadge.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i> ${statusMsg} (+10점)`;
            } else {
                statusBadge.className = "text-center py-2 px-4 rounded-full text-base font-black mb-4 flex items-center justify-center gap-2 bg-rose-100 text-rose-800 border border-rose-200";
                statusBadge.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i> ${statusMsg} (정답: <span class="underline">${targetAnswer}</span>)`;
            }

            // Fill Data
            expIdiom.textContent = currentIdiomObj.idiom;
            expHanja.textContent = currentIdiomObj.hanja;
            expMeaning.textContent = currentIdiomObj.meaning;
            expExample.textContent = `"${currentIdiomObj.example}"`;

            // Render 4 Hanja Character Breakdown cards
            expCharGrid.innerHTML = '';
            currentIdiomObj.characterMeanings.forEach(item => {
                let charCard = document.createElement('div');
                charCard.className = "bg-slate-50 border border-slate-200/80 p-2 rounded-xl flex flex-col items-center justify-center";
                charCard.innerHTML = `
                    <span class="text-xl font-bold text-slate-800 batang-font">${item.char}</span>
                    <span class="text-[11px] font-semibold text-indigo-600 mt-0.5">${item.sound}</span>
                    <span class="text-[10px] text-slate-500">${item.meaning}</span>
                `;
                expCharGrid.appendChild(charCard);
            });

            expModal.classList.remove('hidden');
        }

        function nextQuestion() {
            expModal.classList.add('hidden');
            currentQuestionIndex++;

            if (currentQuestionIndex < gameQuestions.length) {
                loadQuestion();
            } else {
                showFinalResults();
            }
        }

        /* ==================== 11. FINAL RESULT SCREEN ==================== */
        function showFinalResults() {
            stopTimer();
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const totalScore = currentScore;
            const accuracyRate = Math.round((correctCount / gameQuestions.length) * 100) || 0;

            document.getElementById('final-score').textContent = totalScore;
            document.getElementById('final-correct').textContent = `${correctCount}개`;
            document.getElementById('final-incorrect').textContent = `${incorrectCount}개`;
            document.getElementById('final-rate').textContent = `${accuracyRate}%`;

            // High Score Check & LocalStorage logic
            const highScoreBadge = document.getElementById('high-score-badge');
            if (totalScore > highScore) {
                highScore = totalScore;
                localStorage.setItem(STORAGE_KEY, highScore);
                highScoreBadge.classList.remove('hidden');
                
                // Fire confetti animation
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } else {
                highScoreBadge.classList.add('hidden');
            }

            finalHighScoreEl.textContent = `${highScore}점`;

            // Render Incorrect List & Review Button State
            const incorrectSection = document.getElementById('incorrect-section');
            const incorrectListEl = document.getElementById('incorrect-list');
            const btnReview = document.getElementById('btn-review');
            const incorrectCountBadge = document.getElementById('incorrect-count-badge');

            if (incorrectQuestionsList.length > 0) {
                incorrectSection.classList.remove('hidden');
                btnReview.classList.remove('hidden');
                incorrectCountBadge.textContent = `${incorrectQuestionsList.length}개`;

                incorrectListEl.innerHTML = '';
                incorrectQuestionsList.forEach(item => {
                    let div = document.createElement('div');
                    div.className = "p-2 bg-rose-50/70 border border-rose-100 rounded-xl flex justify-between items-center";
                    div.innerHTML = `
                        <div>
                            <span class="font-bold text-slate-800">${item.idiom}</span>
                            <span class="text-indigo-600 font-serif ml-1.5">(${item.hanja})</span>
                        </div>
                        <span class="text-[11px] text-slate-500 truncate max-w-[180px]">${item.meaning}</span>
                    `;
                    incorrectListEl.appendChild(div);
                });
            } else {
                incorrectSection.classList.add('hidden');
                btnReview.classList.add('hidden');
            }
        }
    </script>
